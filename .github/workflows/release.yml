name: Release

on:
  push:
    tags:
    - 'v*'

# Jobs request only permissions they need
permissions: {}

jobs:

  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Generate changelog for release
      run: |
        ./package/extract-changelog.sh "$GITHUB_REF_NAME" | tee release-notes.md
        test -s release-notes.md
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --title "$GITHUB_REF_NAME" \
          --draft --verify-tag --notes-file release-notes.md

  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Check tag matches package version
      run: |
        grep -Fx "__version__ = \"${GITHUB_REF_NAME#v}\"" src/tewi/version.py
    - name: Build package
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        make dist
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish-pypi:
    needs: [draft-release, build-dist]
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI project must have this repository, workflow
    # file and environment configured as trusted publisher
    environment:
      name: pypi
      url: https://pypi.org/p/tewi-torrent
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
