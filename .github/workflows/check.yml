# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Check

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday at 00:00 UTC

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      # Ubuntu AppArmor profile for transmission-daemon allows access only
      # to its default locations, so use them instead of home directory
      TR_CONFIG_DIR: /var/lib/transmission-daemon/.config/transmission-daemon
      TR_DOWNLOAD_DIR: /var/lib/transmission-daemon/downloads
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Generate shell completions
      run: |
        make completions

    - name: Install project dependencies
      run: |
        # --group requires pip >= 25.1 (PEP 735 dependency groups)
        python -m pip install . --group dev

    - name: Install Transmission (cached)
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: transmission-daemon transmission-cli
        version: 1.0

    - name: Configure Transmission
      run: |
        # AppArmor rules for these directories require them to be owned
        # by the user running the daemon
        sudo mkdir -p "$TR_CONFIG_DIR" "$TR_DOWNLOAD_DIR"
        sudo chown -R "$USER" /var/lib/transmission-daemon

        # Create settings file
        cat > "$TR_CONFIG_DIR/settings.json" <<EOF
        {
          "rpc-enabled": true,
          "rpc-port": 9092,
          "rpc-bind-address": "127.0.0.1",
          "rpc-whitelist-enabled": false,
          "rpc-authentication-required": false,
          "download-dir": "$TR_DOWNLOAD_DIR",
          "incomplete-dir-enabled": false,
          "peer-port": 51413
        }
        EOF

    - name: Start Transmission
      run: |
        transmission-daemon --version || true
        # Run in foreground as background job to capture all daemon output
        nohup transmission-daemon --foreground \
          --config-dir "$TR_CONFIG_DIR" \
          --log-level=info > ~/transmission.log 2>&1 &

    - name: Verify Transmission is running
      run: |
        # Wait for RPC port instead of fixed sleep: daemon startup time
        # varies on CI runners
        for i in $(seq 1 30); do
          if transmission-remote 9092 --list; then
            exit 0
          fi
          sleep 1
        done
        echo "Transmission RPC is not available after 30 seconds"
        pgrep -a transmission || echo "transmission-daemon is not running"
        echo "--- Listening sockets"
        ss -ltnp || true
        echo "--- Daemon settings"
        cat "$TR_CONFIG_DIR/settings.json" || true
        echo "--- Daemon log"
        cat ~/transmission.log || true
        exit 1

    - name: Lint source code
      run: |
        make check

    - name: Test project
      env:
        # geoip2fast uses an invalid regex escape sequence, which is only
        # promoted from DeprecationWarning to SyntaxWarning starting with
        # Python 3.12, so older versions need it ignored explicitly.
        PYTEST_ADDOPTS: ${{ (matrix.python-version == '3.10' || matrix.python-version == '3.11') && '-W "ignore:invalid escape sequence:DeprecationWarning"' || '' }}
      run: |
        make test-github
