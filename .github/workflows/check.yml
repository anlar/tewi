# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Check

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  schedule:
    - cron: "0 0 * * 1"  # Weekly on Monday at 00:00 UTC

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0

    - name: Generate shell completions
      run: |
        make completions

    - name: Install project dependencies
      run: |
        # --group requires pip >= 25.1 (PEP 735 dependency groups)
        python -m pip install . --group dev

    - name: Install Transmission (cached)
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: transmission-daemon transmission-cli
        version: 1.0

    - name: Configure Transmission
      run: |
        mkdir -p ~/transmission-config
        mkdir -p ~/transmission-downloads

        # Create settings file
        cat > ~/transmission-config/settings.json <<EOF
        {
          "rpc-enabled": true,
          "rpc-port": 9092,
          "rpc-bind-address": "127.0.0.1",
          "rpc-whitelist-enabled": false,
          "rpc-authentication-required": false,
          "download-dir": "$HOME/transmission-downloads",
          "incomplete-dir-enabled": false,
          "peer-port": 51413
        }
        EOF

    - name: Start Transmission
      run: |
        transmission-daemon --config-dir ~/transmission-config --log-level=info &
        sleep 3

    - name: Verify Transmission is running
      run: |
        transmission-remote 9092 --list
        curl -s http://localhost:9092/transmission/rpc || true

    - name: Lint source code
      run: |
        make check

    - name: Test project
      env:
        # geoip2fast uses an invalid regex escape sequence, which is only
        # promoted from DeprecationWarning to SyntaxWarning starting with
        # Python 3.12, so older versions need it ignored explicitly.
        PYTEST_ADDOPTS: ${{ (matrix.python-version == '3.10' || matrix.python-version == '3.11') && '-W "ignore:invalid escape sequence:DeprecationWarning"' || '' }}
      run: |
        make test-github
